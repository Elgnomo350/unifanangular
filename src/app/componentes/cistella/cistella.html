<section class="cesta">
<h1>Cesta</h1>

@if (getcistella().length == 0) {
<h2>Tu cesta se siente sola...</h2>
<h3>Añade algo para acompañarla!</h3>
<a [routerLink]="'../' + cgetroute('catalogo')">Compra ya!</a>
}
@else {

@for (item of getcistella(); track $index) {

<div class="item-cesta">

<img class="producto-img" [src]="item.foto" alt="foto producte"/>

<div class="info">
<p class="titulo">{{ item.nom }}</p>
<p class="cantidad">Cantidad: {{ item.quantitatcomprada }}</p>
</div>

<div class="acciones">
<button class="btn-modcesta" (click)="borrarelement($index)">🗑</button>
<button class="btn-modcesta" (click)="sumarUnaUnitat($index)">+</button>
<span class="precio">{{ retornarPreuArrodonit(item.preutotal) }}€</span>
<button class="btn-modcesta" (click)="restarUnaUnitat($index)">-</button>
</div>

</div>

}

{{sumTotal()}}

<h2 id="total">Total: 0</h2>
<button (click)="comprar()" class="btn-comprar">Comprar</button>

}

</section>
