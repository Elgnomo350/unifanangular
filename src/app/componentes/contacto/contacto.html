<main>
    <div class="contacte">
        <h2>¿Dónde puedes encontrarnos?</h2>
        <p>Puedes seguirnos y estar al día de nuestras novedades en nuestras redes sociales oficiales:</p>
        <ul>
            <li>
                <img src="https://cdn-icons-png.flaticon.com/512/724/724664.png" alt="Teléfono">
                <span>+34 666999123</span>
            </li>
            <li>
                <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="Correo electrónico">
                <span>contacto@unifan.com</span>
            </li>
            <li>
                <img src="https://cdn-icons-png.flaticon.com/512/535/535239.png" alt="Dirección" style="filter: invert(1);">
                <span>Carrer de la Creativitat, 42 · Barcelona</span>
            </li>
            <li>
                <img src="https://cdn-icons-png.flaticon.com/512/2921/2921222.png" alt="Horario">
                <span>Lunes a Viernes · 9:00 - 18:00</span>
            </li>
        </ul>

        <br>

        <form class="form-contacte" (ngSubmit)="enviarConsulta(correu.value, nom.value, consulta.value)">
            <h2>Tienes una duda? Escribenos</h2>
            
            <div class="campo">
                <label for="nom">Nombre</label>
                <input type="text" #nom id="nom" name="nom" placeholder="Tu nombre" required>
            </div>

            <div class="campo">
                <label for="correu">Correo electrónico</label>
                <input type="email" id="correu" #correu name="correu" placeholder="tuemail@ejemplo.com" required>
            </div>

            <div class="campo">
                <label for="consulta">Consulta</label>
                <textarea id="consulta" #consulta name="consulta" rows="7" placeholder="Escribe tu consulta..." required></textarea>
            </div>

            <re-captcha siteKey="6Lc_JvAsAAAAAGo56PeY1YJSz_PmnRUy3s69Zic-" (resolved)="onCaptchaResolved($event)"></re-captcha>

            <button type="submit">Enviar</button>
            <button type="reset">Reset</button>
        </form>
    </div>
</main>
