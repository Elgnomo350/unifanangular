<header>
  <div class="logo">
    <a [routerLink]="cgetroute('index')"><img [src]="cgetpath('img/logosinletras.png')" alt="Logo"></a>
    <a [routerLink]="cgetroute('index')"><h1>Uni<span>Fan</span></h1></a>
  </div>

  <div class="botones-header">
    <button><a [routerLink]="cgetroute('catalogo')">Catálogo</a></button>
    <button><a [routerLink]="cgetroute('index')">Destacados</a></button>
    <button><a [routerLink]="cgetroute('contacto')">Contacto</a></button>
  </div>

  <div class="icon">
    @if (registrat) {
      <b>{{ Usuari }}</b>
    }
    <a [routerLink]="cgetroute('registre')"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png" alt="Perfil"></a>
    <div class="cart">
      <a [routerLink]="cgetroute('cistella')"><img src="https://cdn-icons-png.flaticon.com/512/3144/3144456.png" alt="Carrito"></a>
      <span class="count">0</span>
    </div>
  </div>
</header>
