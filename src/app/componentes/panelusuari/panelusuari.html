<div class="user-panel">
  <h1>Panel de Usuario</h1>
  
  <div class="user-info">
  <p #nombre (click)="ponerNombreRojo()">
  </p>

  <p #cognom (mouseenter)="ponerCognomAzul()"(mouseleave)="quitarCognomAzul()">
  </p>    
    <p>Clica en el nombre o pasa el mouse sobre el apellido para que cambien de color! (Se ha usado @ViewChild para estos eventos)</p>
  </div>

  <div class="user-actions">
    <button class="btn logout">Cerrar sesión</button>
    <button class="btn delete">Eliminar mi cuenta</button>
  </div>
</div>
