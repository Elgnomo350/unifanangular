<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña</title>
</head>
<body>

  <div class="container">
    <h1>Introducir correo para recuperar contraseña</h1>
    <form id="recoverForm" (ngSubmit)="getPasswdEmail(correu.value)">
      <input type="email" placeholder="Correo electrónico" #correu required>
      <button type="submit">Enviar</button>
    </form>
    <div class="note">Recibirás un enlace temporal para restablecer tu contraseña</div>
  </div>
</body>
</html>
